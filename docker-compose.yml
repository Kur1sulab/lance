services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 文件中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-lance}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lance} -d ${POSTGRES_DB:-lance}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  lance:
    # 此 fork 每次发布标签(v*)时向 GitHub Container Registry 发布的镜像
    # （.github/workflows/release.yml 的 docker job）。镜像由本仓库自行构建并推送。
    image: ghcr.io/Kur1sulab/lance:${LANCE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LANCE_PG_DSN: postgres://${POSTGRES_USER:-lance}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lance}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LANCE_LLM_PROVIDER: ${LANCE_LLM_PROVIDER:-}
      LANCE_LLM_MODEL: ${LANCE_LLM_MODEL:-}
      LANCE_LLM_BASE_URL: ${LANCE_LLM_BASE_URL:-}
      LANCE_LLM_PROXY: ${LANCE_LLM_PROXY:-}
      # 首次运行保护。留空则启动日志会打印随机设置 token，并在 /setup 中使用该值
      # 必须输入才能创建管理员密码（可用 docker compose logs lance 查看）。
      # 提供 LANCE_ADMIN_PASSWORD 时，会直接用该值初始化，跳过 /setup（8 字符以上）。
      LANCE_SETUP_TOKEN: ${LANCE_SETUP_TOKEN:-}
      LANCE_ADMIN_PASSWORD: ${LANCE_ADMIN_PASSWORD:-}
      # 浏览器跨源允许列表（逗号分隔）。内嵌 UI 同源，通常留空。
      LANCE_CORS_ORIGINS: ${LANCE_CORS_ORIGINS:-}
      # 服务端默认输出语言（en·zh·es·ja）。留空则为中文。Agent 输出和错误消息使用设置界面中的
      # 「显示语言」优先，服务器控制台日志只遵循此值。
      LANCE_LANG: ${LANCE_LANG:-}
    ports:
      #默认值仅发布到主机的 127.0.0.1。若要从其他设备直接访问，请在 .env 中
      # 可以设置 LANCE_BIND=0.0.0.0，但在此之前必须先完成初始设置（管理员密码），
      # 尽可能使用 README 中的反向代理（HTTPS）配置。
      - "${LANCE_BIND:-127.0.0.1}:8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # 将数据目录（含 jwt.key、SQLite 等）绑定到项目根目录的 data/。
      # 可直接在主机上查看和备份，重建容器后也不会丢失。
      - ./data:/app/data
      # 将项目根目录的 skills 挂载到容器中（覆盖镜像内置的 /app/skills）。
      # 修改 skill 后无需重新构建镜像，容器会直接读取宿主机上的该文件。
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
